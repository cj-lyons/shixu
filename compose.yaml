name: shixu
services:
  app:
    build: .
    container_name: shixu-app
    restart: unless-stopped
    cpus: 1
    mem_limit: 512m
    env_file: .env
    ports:
      - "127.0.0.1:18081:3000"
    volumes:
      - ./data:/app/data
    networks:
      - baota
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
networks:
  baota:
    external: true
    name: baota-trial_default
